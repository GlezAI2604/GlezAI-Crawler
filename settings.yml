# Configuración mínima: toma todos los defaults de SearXNG y solo
# sobreescribe lo necesario para que nuestro backend pueda usarlo
# como API (JSON) sin que el limitador de bots lo bloquee.
use_default_settings: true

general:
  instance_name: "veritas-search"

server:
  # Clave requerida por SearXNG. No es crítica para este uso (no es
  # una instancia pública de cara al mundo), pero debe existir.
  secret_key: "cambia-esta-clave-por-cualquier-texto-random-123456"
  limiter: false
  image_proxy: false

search:
  formats:
    - html
    - json
engines:
  - name: wikipedia
    disabled: false

  - name: bing
    disabled: false

  - name: mojeek
    disabled: false

  - name: qwant
    disabled: false

  - name: duckduckgo
    disabled: false
